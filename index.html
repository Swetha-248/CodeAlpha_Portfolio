<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Image Gallery</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f2f2f2;
  text-align: center;
}

h2 {
  margin-bottom: 15px;
}

.filters button {
  padding: 8px 15px;
  margin: 5px;
  border: none;
  background: #333;
  color: white;
  cursor: pointer;
  border-radius: 5px;
  transition: background 0.3s;
}

.filters button:hover {
  background: #555;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

.gallery img {
  width: 100%;
  height: 180px;         
  object-fit: cover;          
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.4s, box-shadow 0.4s;
}

.gallery img:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}


.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.lightbox img {
  max-width: 80%;
  max-height: 80%;
  border-radius: 10px;
}

.close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}

.prev, .next {
  position: absolute;
  top: 50%;
  font-size: 30px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
}

.prev { left: 20px; }
.next { right: 20px; }

/* Responsive */
@media (max-width: 600px) {
  .gallery img {
    height: 150px;
  }
}
</style>
</head>

<body>

<h2>My Image Gallery </h2>

<div class="filters">
  <button onclick="filterImages('all')">All</button>
  <button onclick="filterImages('nature')">Nature</button>
  <button onclick="filterImages('city')">City</button>
  <button onclick="filterImages('animals')">Animals</button>
</div>

<div class="gallery">

  <!-- Nature -->
  <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" class="nature" onclick="openLightbox(0)">
  <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" class="nature" onclick="openLightbox(1)">
  <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" class="nature" onclick="openLightbox(2)">
  <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" class="nature" onclick="openLightbox(3)">
  <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" class="nature" onclick="openLightbox(4)">
  <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff" class="nature" onclick="openLightbox(5)">

  <!-- City -->
  <img src="https://images.unsplash.com/photo-1467269204594-9661b134dd2b" class="city" onclick="openLightbox(6)">
  <img src="https://images.unsplash.com/photo-1494526585095-c41746248156" class="city" onclick="openLightbox(7)">
  <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df" class="city" onclick="openLightbox(8)">
  <img src="https://images.unsplash.com/photo-1508057198894-247b23fe5ade" class="city" onclick="openLightbox(9)">
  <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d" class="city" onclick="openLightbox(10)">
  <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80">


  <!-- Animals -->
  <img src="https://images.unsplash.com/photo-1508672019048-805c876b67e2" class="animals" onclick="openLightbox(12)">
  <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a" class="animals" onclick="openLightbox(13)">
  <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131" class="animals" onclick="openLightbox(14)">
  <img src="https://images.unsplash.com/photo-1504208434309-cb69f4fe52b0" class="animals" onclick="openLightbox(15)">
  <img src="https://images.unsplash.com/photo-1517423440428-a5a00ad493e8" class="animals" onclick="openLightbox(16)">
  <img src="https://images.unsplash.com/photo-1516637090014-cb1ab78511f5" class="animals" onclick="openLightbox(17)">

</div>

<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">×</span>
  <button class="prev" onclick="changeImage(-1)">❮</button>
  <img id="lightbox-img">
  <button class="next" onclick="changeImage(1)">❯</button>
</div>

<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

let currentIndex = 0;

function openLightbox(index) {
  currentIndex = index;
  lightbox.style.display = "flex";
  lightboxImg.src = images[currentIndex].src;
}

function closeLightbox() {
  lightbox.style.display = "none";
}

function changeImage(step) {
  currentIndex += step;
  if (currentIndex < 0) currentIndex = images.length - 1;
  if (currentIndex >= images.length) currentIndex = 0;
  lightboxImg.src = images[currentIndex].src;
}

function filterImages(category) {
  images.forEach(img => {
    img.style.display =
      category === "all" || img.classList.contains(category)
      ? "block"
      : "none";
  });
}
</script>

</body>
</html>
